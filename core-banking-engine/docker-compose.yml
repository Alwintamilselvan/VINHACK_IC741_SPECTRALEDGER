services:
  postgres:
    image: postgres:16
    container_name: spectraledger-postgres
    environment:
      POSTGRES_DB: spectraledger
      POSTGRES_USER: spectra
      POSTGRES_PASSWORD: spectra_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spectra -d spectraledger"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
